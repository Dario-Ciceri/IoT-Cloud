class: IotDeviceState
table: iot_device_state
fields:
    iotDevice: IotDevice?, relation(name=iot_device_state)
    status: IotDeviceStatus
    cpuLoad: int
    temp: double
    mem: double
    errorMessage: String?
    heartBeat: DateTime, default=now
    createdAt: DateTime, default=now
    updatedAt: DateTime, default=now